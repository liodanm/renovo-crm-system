name: CI

# Runs on every pull request into main — this is a build/type-check gate,
# not a deployment mechanism. Railway watches `main` directly and deploys
# independently of anything that happens here; nothing in this file pushes
# code anywhere or talks to Railway at all. The point is to catch a broken
# build (or a real regression like the DI/encoding bugs found earlier in
# this project) before it's even mergeable, instead of discovering it only
# after Railway tries to deploy it.
on:
  pull_request:
    branches: [main]

jobs:
  repo-integrity:
    name: Repository integrity — duplicate source, migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure bash + coreutils (sha256sum, find, sort) -- no dependency install
      # needed, so this job stays fast and runs independently of whether the
      # backend/frontend jobs below even succeed.
      - name: Check for duplicate/stray source trees
        run: ./scripts/check-duplicate-source.sh

      - name: Check init-scripts/ is in sync with backend/prisma/migrations/
        run: ./scripts/check-migration-sync.sh

  backend:
    name: Backend — install, generate, type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Real network access here (unlike the sandbox this project was
      # largely built in) — this is expected to actually succeed on a
      # GitHub-hosted runner, generating the real Prisma client.
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          # prisma generate doesn't connect to a database — it only reads
          # schema.prisma — but it does check that DATABASE_URL exists as
          # an env var, since the schema references it. A placeholder is
          # sufficient and correct here; a real one is not needed until
          # something actually connects.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_placeholder'

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — install, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
