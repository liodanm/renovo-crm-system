name: renovo-crm

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: renovo
      POSTGRES_PASSWORD: renovo_local_dev_only
      POSTGRES_DB: renovo_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres's init mechanism only runs TOP-LEVEL files in this
      # directory, alphabetically — it does not recurse into
      # subdirectories. init-scripts/ is a flat, pre-ordered copy of the
      # base schema + every migration (00-schema.sql sorts before
      # 000_..., 001_..., etc. — verified, not assumed) for exactly that
      # reason. Only runs on a genuinely empty data volume (first-ever
      # startup); has no effect on an existing database.
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renovo -d renovo_crm']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever .env has for these two — inside Docker's network,
      # "localhost" means the container itself, not the postgres/redis
      # containers. Everything else (secrets, integration keys) still
      # comes from .env, so those don't need duplicating here.
      DATABASE_URL: postgresql://renovo:renovo_local_dev_only@postgres:5432/renovo_crm
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
